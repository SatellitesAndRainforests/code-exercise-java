spring:
  application:
    name: url-shortener-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/urlshortenerdb}
    driver-class-name: org.h2.Driver
    username: sa
    password:
    
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: true

app:
   base-url: ${APP_BASE_URL:http://localhost:8080}

